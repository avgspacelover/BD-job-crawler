name: find-slugs

on:
  workflow_dispatch:         # run it by hand from the Actions tab

permissions:
  contents: write            # needed to commit companies.json

concurrency:
  group: job-alerts          # shares the lock with the daily job so they never collide
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Discover job boards
        run: |
          python find_slugs.py | tee slugs_report.txt
          { echo '```'; cat slugs_report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save companies.json
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add companies.json
          git diff --cached --quiet || (git commit -m "update companies.json" && git push)
