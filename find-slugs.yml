name: find-slugs

on:
  schedule:
    - cron: "0 4 * * 1"      # Mondays 04:00 UTC = 9:30 AM IST: picks up newly funded companies
  workflow_dispatch:         # or run it by hand from the Actions tab

permissions:
  contents: write            # needed to commit companies.json

concurrency:
  group: job-alerts          # shares the lock with the daily job so they never collide
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Discover job boards
        run: |
          python find_slugs.py | tee slugs_report.txt
          { echo '```'; cat slugs_report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save results
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add companies.json slug_misses.json
          git diff --cached --quiet || (git commit -m "update company list" && git push)
