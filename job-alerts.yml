name: job-alerts

on:
  schedule:
    - cron: "30 3 * * *"    # 03:30 UTC = 9:00 AM IST
    - cron: "30 10 * * *"   # 10:30 UTC = 4:00 PM IST
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write            # needed to commit the seen-files back

concurrency:
  group: job-alerts          # never run two copies at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python job_alerts.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}      # optional
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}    # optional
      - run: python funding_watch.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
      - name: Save seen state
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen.json seen_news.json
          git diff --cached --quiet || (git commit -m "update seen state" && git push)
